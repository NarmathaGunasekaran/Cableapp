name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for settings.gradle..."

          PROJECT_DIR=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Android project found in repository root."
            PROJECT_DIR="."
          fi

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project files
        shell: bash
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo "Files:"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Building Android APK..."
          gradle --no-daemon clean assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find . -type f -name "app-debug.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCablePro-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
         
