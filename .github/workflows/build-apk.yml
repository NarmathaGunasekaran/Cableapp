name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Android project..."

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project
        shell: bash
        run: |
          echo "Project directory: $PROJECT_DIR"
          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"
          echo ""
          echo "App folder:"
          ls -la "$PROJECT_DIR/app"

      - name: Check Gradle
        shell: bash
        run: |
          echo "Gradle location:"
          which gradle

          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Starting Android build..."

          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyCablePro-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
