name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MyCablePro_Exact_UI_GitHub/CableManager_Updated_OriginalExcel_FULL

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show project files
        run: |
          pwd
          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CableManager-Debug-APK
          path: MyCablePro_Exact_UI_GitHub/CableManager_Updated_OriginalExcel_FULL/app/build/outputs/apk/debug/*.apk
